# {plugin.pluginName} properties file

#######################################################################################################
# Default Labels for XPage
bandeaugra.pageTitle=bandeaugra
bandeaugra.pagePathLabel=bandeaugra
bandeaugra.includeUrl.webappBandeau=
beadeaugra.myappsWsUrl=
beadeaugra.notificationsWsUrl=
beadeaugra.myfavoritesWsUrl=

bandeaugra.authorizedDomains=.paris.fr,.mdp

# OAuth2 data client reading the user information the banner shows, and the authenticator signing the calls to
# the remote banner web services. These values were the <property> entries of the Spring context.
bandeaugra.dataclient.bannerInfo.dataServerUri=https://fcp.integ01.dev-franceconnect.fr/api/v1/userinfo
bandeaugra.dataclient.bannerInfo.tokenMethod=HEADER
bandeaugra.dataclient.bannerInfo.scopes=openid,profile,email,address,phone
bandeaugra.requestAuthenticator.privateKey=change me
